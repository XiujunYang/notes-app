spring:
  application:
    name: notes-app
  data:
    mongodb:
      uri: mongodb://localhost:27017/notesdb
  web:
    # CORS configuration
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"

server.port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging.level:
  com.example.notesapp: DEBUG